<!DOCTYPE html>
<html>
<head>
    <title>Подтверждение возраста</title>
    <meta charset="UTF-8"> 
</head>
<body>
	<h1>Конспект курса</h1>
	<p class="learned-ok">Парные теги.</p>
	<p class="learned-ok">Одиночные теги.</p>
	<p class="learned-ok">Атрибуты тегов.</p>
	<p class="learned-ok">Инлайновые (встроенные) стили.</p>
	<p class="learning-in-progress">Внешние стили.</p>
	<p class="not-learned">Стилизация по классам.</p>
    <script>
        let age;
        let isConfirmed = false; 
        do {
			age = prompt("Сколько вам лет?", "");

            if (age === null) {
                alert("Ввод возраста отменен. Попробуйте снова, если передумаете.");
                isConfirmed = true;
            } else {
                isConfirmed = confirm("Вам действительно " + age + " лет?");
            }

        } while (!isConfirmed); 

        if (age !== null && isConfirmed) {
             alert("Отлично! Ваш возраст подтвержден.");
        }
    </script>

</body>
	<style>
		body {
		font-family: Tahoma, serif;
		}
		h1 {
		color: #999999;
		}
		.learned-ok {
		color: green;
		}
		.learning-in-progress {
		color: orange;
		}
		20
		.not-learned {
		color: red;
		}
	</style>
</html>
